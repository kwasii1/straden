name: docker

# Builds the multi-arch image. On pull requests it only checks that the image
# builds; publishing happens through the release workflow (after tests pass)
# or a manual run.
on:
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_call:
    inputs:
      version:
        description: Release version (e.g. 1.2.0) to tag the image with. Empty for untagged builds.
        type: string
        default: ''
      push:
        description: Push the image to GHCR.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.2.0) to tag the image with. Leave empty to publish only latest.
        type: string
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/straden
  PUSH: ${{ github.event_name == 'workflow_dispatch' || inputs.push == true }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUSH == 'true' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
