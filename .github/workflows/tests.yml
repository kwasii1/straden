name: tests

on:
  # Pushes to main run through the release workflow, which calls this one.
  push:
    branches:
      - develop
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install k6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep in sync with K6_VERSION in the Dockerfile.
          K6_VERSION: v2.0.0
        run: |
          gh release download "$K6_VERSION" --repo grafana/k6 --pattern 'k6-*-linux-amd64.tar.gz' --dir /tmp/k6dl
          tar -xzf /tmp/k6dl/k6-*-linux-amd64.tar.gz -C /tmp/k6dl
          sudo mv /tmp/k6dl/k6-*/k6 /usr/local/bin/k6
          k6 version

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Run Tests
        run: php artisan test
